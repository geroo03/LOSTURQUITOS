// ---------- Pedido ⇄ Presupuesto ----------

// Pedido → presupuesto: abre el editor con los productos del pedido (con los precios a los que se pidieron).
function presupuestoDesdePedido(id){
  const p = pedidos.find(x => x.id === id);
  if (!p) return;
  const items = (Array.isArray(p.items) ? p.items : []).map(it => {
    const prod = productos.find(x => x.nombre === it.nombre && (x.unidad || '') === it.unidad);
    return { producto_id: prod ? prod.id : null, nombre: it.nombre, unidad: it.unidad, precio: it.precio, cantidad: it.cantidad };
  });
  const base = { ...nuevoPresBase(), cliente_nombre: p.cliente_nombre || '', items, pedido_id: p.id };
  showTab('presupuestos');
  openPresEditor(null, base, `Armado a partir del pedido #${p.id}: se copiaron sus productos con los precios del pedido. Podés cambiar precios, cantidades y agregar el descuento.`);
}

// Presupuesto → pedido: crea el pedido ya confirmado y deja el presupuesto como aceptado.
async function pasarPresupuestoAPedido(id){
  const p = presupuestos.find(x => x.id === id);
  if (!p) return;
  if (p.pedido_id){ showTab('pedidos'); return; }
  if (!confirm(`¿Pasar el presupuesto #${id} a pedido? Se crea un pedido confirmado con estos productos y el presupuesto queda como aceptado.`)) return;
  const t = calcTotalesPres(p);
  const nota = [p.nota, p.descuento_pct ? `Descuento del ${p.descuento_pct}% ya incluido en el total.` : ''].filter(Boolean).join(' ');
  const { data, error } = await sb.from('pedidos').insert({
    cliente_nombre: p.cliente_nombre || null,
    nota: nota || null,
    items: (p.items || []).map(it => ({ nombre: it.nombre, unidad: it.unidad, precio: it.precio, cantidad: it.cantidad })),
    total: t.total,
    estado: 'confirmado',
    presupuesto_id: p.id,
    user_id: null,
  }).select().single();
  if (error){
    alert('No se pudo crear el pedido: ' + error.message + '\n\nSi habla de una columna que no existe, corré supabase_cuentas_y_seguridad.sql en Supabase.');
    return;
  }
  const { error: e2 } = await sb.from('presupuestos').update({ estado: 'aceptado', pedido_id: data.id, actualizado_en: new Date().toISOString() }).eq('id', id);
  if (e2) console.error('No se pudo marcar el presupuesto como aceptado:', e2.message);
  const idx = presupuestos.findIndex(x => x.id === id);
  if (idx >= 0) presupuestos[idx] = { ...presupuestos[idx], estado: 'aceptado', pedido_id: data.id };
  await loadPedidos();
  renderPresupuestosLista();
  showTab('pedidos');
}

// ---------- Precios por planilla (Excel / CSV) ----------
// "Descargar planilla" baja todos los productos; Karim cambia precios en Excel y los vuelve a subir con "Importar".
// Solo se aplican los cambios de precio, oferta, sin stock y activo; las filas sin id son productos nuevos.

let importPlan = null; // { cambios: [...], nuevos: [...], errores: [...] }

function normKey(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '_'); }
function toBool(v){ return ['si', 'sí', 's', 'yes', 'y', 'true', '1', 'x', 'verdadero'].includes(String(v).trim().toLowerCase()); }
function toPrice(v){
  if (v === '' || v === null || v === undefined) return null;
  if (typeof v === 'number') return Math.round(v);
  let s = String(v).replace(/[^\d,.-]/g, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return Number.isFinite(n) ? Math.round(n) : NaN;
}

function descargarPlanilla(){
  if (!window.XLSX){ alert('No se pudo cargar el generador de Excel. Revisá tu conexión y recargá.'); return; }
  const orden = new Map(categorias.map((c, i) => [c.id, i]));
  const filas = [...productos]
    .sort((a, b) => (orden.get(a.categoria_id) ?? 99) - (orden.get(b.categoria_id) ?? 99) || a.nombre.localeCompare(b.nombre, 'es'))
    .map(p => ({
      id: p.id, categoria: categoriaLabel(p.categoria_id), nombre: p.nombre, unidad: p.unidad || '', precio: p.precio,
      precio_oferta: p.precio_oferta != null ? p.precio_oferta : '', sin_stock: p.sin_stock ? 'SI' : '', activo: p.activo ? 'SI' : 'NO',
    }));
  const ws = XLSX.utils.json_to_sheet(filas);
  ws['!cols'] = [{ wch: 6 }, { wch: 24 }, { wch: 42 }, { wch: 9 }, { wch: 10 }, { wch: 14 }, { wch: 10 }, { wch: 8 }];
  const ayuda = XLSX.utils.aoa_to_sheet([
    ['Cómo usar esta planilla'],
    ['1. Cambiá los valores de las columnas precio, precio_oferta, sin_stock y activo.'],
    ['2. precio_oferta: dejalo vacío si no está en oferta; tiene que ser menor al precio.'],
    ['3. sin_stock: escribí SI si no hay stock; vacío si hay. activo: SI o NO (NO lo saca del catálogo).'],
    ['4. No cambies la columna id: es la que identifica el producto. El nombre, la unidad y la categoría no se modifican desde acá.'],
    ['5. Para agregar un producto nuevo, sumá una fila con el id vacío y completá categoria, nombre, unidad y precio.'],
    ['6. Guardá el archivo y subilo con "Importar precios" en el panel.'],
  ]);
  ayuda['!cols'] = [{ wch: 120 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Productos');
  XLSX.utils.book_append_sheet(wb, ayuda, 'Instrucciones');
  XLSX.writeFile(wb, 'precios-los-turquitos.xlsx');
}

async function importarPlanilla(file){
  if (!file) return;
  if (!window.XLSX){ alert('No se pudo cargar el lector de Excel. Revisá tu conexión y recargá.'); return; }
  let rows;
  try {
    const isCsv = /\.csv$/i.test(file.name);
    const wb = isCsv ? XLSX.read(await file.text(), { type: 'string' }) : XLSX.read(await file.arrayBuffer(), { type: 'array' });
    rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
  } catch (e){
    alert('No se pudo leer el archivo: ' + e.message);
    return;
  }
  document.getElementById('imp-file').value = '';

  const ALIAS = { id: 'id', categoria: 'categoria', nombre: 'nombre', producto: 'nombre', unidad: 'unidad', presentacion: 'unidad',
    precio: 'precio', precio_oferta: 'precio_oferta', oferta: 'precio_oferta', sin_stock: 'sin_stock', activo: 'activo' };
  const norm = rows.map(r => { const o = {}; Object.keys(r).forEach(k => { const a = ALIAS[normKey(k)]; if (a) o[a] = r[k]; }); return o; });
  if (!norm.length || !norm.some(r => 'precio' in r)){
    alert('No encontré la columna "precio". Usá la planilla que baja el botón "Descargar planilla".');
    return;
  }

  const plan = { cambios: [], nuevos: [], errores: [], sinCambios: 0 };
  const catPorTexto = (t) => categorias.find(c => normKey(c.id) === normKey(t) || normKey(c.label) === normKey(t));
  norm.forEach((r, i) => {
    const fila = i + 2; // fila en Excel (1 = encabezado)
    const id = r.id === '' || r.id === undefined ? null : parseInt(r.id, 10);
    if (id === null){
      if (!r.nombre && !r.precio) return; // fila vacía
      const cat = catPorTexto(r.categoria);
      const precio = toPrice(r.precio);
      if (!cat || !String(r.nombre).trim() || !String(r.unidad).trim() || precio === null || Number.isNaN(precio) || precio < 0){
        plan.errores.push(`Fila ${fila}: producto nuevo incompleto (hace falta categoría existente, nombre, unidad y precio).`);
        return;
      }
      const oferta = toPrice(r.precio_oferta);
      if (oferta !== null && (Number.isNaN(oferta) || oferta >= precio)){ plan.errores.push(`Fila ${fila}: el precio de oferta tiene que ser menor al precio.`); return; }
      plan.nuevos.push({ categoria_id: cat.id, categoria_label: cat.label, nombre: String(r.nombre).trim(), unidad: String(r.unidad).trim(), precio,
        precio_oferta: oferta, sin_stock: toBool(r.sin_stock), activo: r.activo === '' ? true : toBool(r.activo) });
      return;
    }
    const p = productos.find(x => x.id === id);
    if (!p){ plan.errores.push(`Fila ${fila}: no existe un producto con id ${id}.`); return; }
    const cambio = {}; const det = [];
    const precio = 'precio' in r ? toPrice(r.precio) : null;
    if (precio !== null){
      if (Number.isNaN(precio) || precio < 0){ plan.errores.push(`Fila ${fila} (${p.nombre}): precio inválido "${r.precio}".`); return; }
      if (precio !== p.precio){ cambio.precio = precio; det.push(['Precio', money(p.precio), money(precio)]); }
    }
    const precioFinal = cambio.precio !== undefined ? cambio.precio : p.precio;
    if ('precio_oferta' in r){
      const oferta = toPrice(r.precio_oferta);
      if (Number.isNaN(oferta) || (oferta !== null && (oferta < 0 || oferta >= precioFinal))){ plan.errores.push(`Fila ${fila} (${p.nombre}): la oferta tiene que ser un número menor al precio.`); return; }
      const actual = p.precio_oferta != null ? p.precio_oferta : null;
      if (oferta !== actual){ cambio.precio_oferta = oferta; det.push(['Oferta', actual === null ? '—' : money(actual), oferta === null ? 'sin oferta' : money(oferta)]); }
    }
    if ('sin_stock' in r){
      const v = toBool(r.sin_stock);
      if (v !== !!p.sin_stock){ cambio.sin_stock = v; det.push(['Stock', p.sin_stock ? 'sin stock' : 'hay', v ? 'sin stock' : 'hay']); }
    }
    if ('activo' in r && String(r.activo).trim() !== ''){
      const v = toBool(r.activo);
      if (v !== !!p.activo){ cambio.activo = v; det.push(['Activo', p.activo ? 'sí' : 'no', v ? 'sí' : 'no']); }
    }
    if (det.length) plan.cambios.push({ id, nombre: p.nombre, unidad: p.unidad, cambio, det }); else plan.sinCambios++;
  });

  importPlan = plan;
  const filasDet = plan.cambios.flatMap(c => c.det.map(d => `<tr><td>${escapeHtml(c.nombre)}</td><td>${escapeHtml(c.unidad || '')}</td><td>${d[0]}</td><td>${escapeHtml(d[1])} → <strong>${escapeHtml(d[2])}</strong></td></tr>`));
  document.getElementById('imp-body').innerHTML = `
    <p style="font-size:13px;margin:0 0 10px"><strong>${plan.cambios.length}</strong> productos con cambios · <strong>${plan.nuevos.length}</strong> nuevos · ${plan.sinCambios} sin cambios${plan.errores.length ? ` · <span style="color:var(--alta)"><strong>${plan.errores.length}</strong> con errores</span>` : ''}</p>
    ${plan.errores.length ? `<div style="background:rgba(186,26,26,.08);border:1px solid rgba(186,26,26,.3);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:10px;max-height:110px;overflow:auto">${plan.errores.map(e => escapeHtml(e)).join('<br>')}<br><em>Las filas con error no se aplican.</em></div>` : ''}
    ${plan.nuevos.length ? `<p style="font-size:12.5px;margin:0 0 8px"><strong>Productos nuevos:</strong> ${plan.nuevos.map(n => escapeHtml(n.nombre) + ' (' + escapeHtml(n.unidad) + ')').join(', ')}</p>` : ''}
    ${filasDet.length ? `<div style="max-height:280px;overflow:auto"><table class="productos-table"><thead><tr><th>Producto</th><th>Unidad</th><th>Cambio</th><th>Antes → Después</th></tr></thead><tbody>${filasDet.slice(0, 300).join('')}</tbody></table>${filasDet.length > 300 ? `<p style="font-size:11.5px;color:var(--muted)">Mostrando los primeros 300 cambios de ${filasDet.length}.</p>` : ''}</div>` : ''}`;
  document.getElementById('imp-apply').disabled = !(plan.cambios.length || plan.nuevos.length);
  document.getElementById('imp-status').textContent = '';
  document.getElementById('imp-overlay').classList.add('open');
  document.getElementById('imp-modal').classList.add('open');
}

function cerrarImport(){
  document.getElementById('imp-overlay').classList.remove('open');
  document.getElementById('imp-modal').classList.remove('open');
  importPlan = null;
}

async function aplicarImport(){
  if (!importPlan) return;
  const btn = document.getElementById('imp-apply'), st = document.getElementById('imp-status');
  btn.disabled = true;
  const cola = [...importPlan.cambios];
  let hechos = 0; const fallos = [];
  const worker = async () => {
    while (cola.length){
      const c = cola.shift();
      const { error } = await sb.from('productos').update(c.cambio).eq('id', c.id);
      if (error) fallos.push(`${c.nombre}: ${error.message}`); else hechos++;
      st.textContent = `Aplicando… ${hechos + fallos.length} de ${importPlan.cambios.length}`;
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  let nuevosOk = 0;
  if (importPlan.nuevos.length){
    const { error } = await sb.from('productos').insert(importPlan.nuevos);
    if (error) fallos.push('Productos nuevos: ' + error.message); else nuevosOk = importPlan.nuevos.length;
  }
  await loadProductos();
  if (fallos.length){
    st.innerHTML = `<span style="color:var(--alta)">Se aplicaron ${hechos} cambios${nuevosOk ? ' y ' + nuevosOk + ' productos nuevos' : ''}, pero hubo ${fallos.length} errores:<br>${fallos.slice(0, 5).map(escapeHtml).join('<br>')}${fallos.some(f => /column/i.test(f)) ? '<br>Si habla de una columna, corré supabase_add_producto_sin_stock.sql / supabase_add_producto_oferta.sql en Supabase.' : ''}</span>`;
    btn.disabled = false;
    return;
  }
  st.innerHTML = `<span style="color:#0f6b34"><strong>Listo:</strong> ${hechos} productos actualizados${nuevosOk ? ' y ' + nuevosOk + ' nuevos' : ''}.</span>`;
  importPlan = null;
  setTimeout(cerrarImport, 1800);
}

// ---------- Presupuestos ----------
// Karim arma presupuestos para sus clientes (tabla `presupuestos`), los guarda como historial y puede repetirlos.
// Cada línea guarda su propio precio: cambiar precios en Productos no altera presupuestos ya hechos.

const ESTADOS_PRES = [
  { id: 'borrador',  label: 'Borrador' },
  { id: 'enviado',   label: 'Enviado' },
  { id: 'aceptado',  label: 'Aceptado' },
  { id: 'rechazado', label: 'Rechazado' },
];

function precioActualProducto(p){
  return (p.precio_oferta != null && p.precio_oferta < p.precio) ? p.precio_oferta : p.precio;
}

function calcTotalesPres(p){
  const subtotal = (p.items || []).reduce((n, it) => n + it.precio * it.cantidad, 0);
  const descuento = Math.round(subtotal * (p.descuento_pct || 0) / 100);
  return { subtotal, descuento, total: subtotal - descuento };
}

async function loadPresupuestos(){
  const { data, error } = await sb.from('presupuestos').select('*').order('creado_en', { ascending: false });
  if (error){
    const falta = /presupuestos/i.test(error.message) && /(does not exist|schema cache|relation)/i.test(error.message);
    document.getElementById('presupuestos-view').innerHTML = `<p style="padding:20px;color:var(--muted)">${
      falta
        ? 'Todavía falta crear la tabla de presupuestos: corré <code>supabase_setup_presupuestos.sql</code> en el SQL Editor de Supabase y recargá esta página.'
        : 'Error cargando presupuestos: ' + escapeHtml(error.message)
    }</p>`;
    return;
  }
  presupuestos = data || [];
  renderPresupuestos();
}

function renderPresupuestos(){
  const view = document.getElementById('presupuestos-view');
  view.innerHTML = `
    <div id="productos-toolbar">
      <input type="text" id="pres-search" placeholder="Buscar por cliente o número...">
      <select id="pres-filter-estado">
        <option value="">Todos los estados</option>
        ${ESTADOS_PRES.map(e => `<option value="${e.id}">${e.label}</option>`).join('')}
      </select>
      <span id="productos-count"></span>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="openPresEditor(null)">+ Nuevo presupuesto</button>
    </div>
    <div id="pres-results-list"></div>`;
  const s = document.getElementById('pres-search'), f = document.getElementById('pres-filter-estado');
  s.value = filtroPresTexto; f.value = filtroPresEstado;
  s.addEventListener('input', (e) => { filtroPresTexto = e.target.value; renderPresupuestosLista(); });
  f.addEventListener('change', (e) => { filtroPresEstado = e.target.value; renderPresupuestosLista(); });
  renderPresupuestosLista();
}

function renderPresupuestosLista(){
  renderResumen();
  const q = filtroPresTexto.trim().toLowerCase();
  const list = presupuestos.filter(p => {
    if (filtroPresEstado && p.estado !== filtroPresEstado) return false;
    if (q && !(`${p.id} ${p.cliente_nombre || ''}`.toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById('productos-count').textContent = `${list.length} de ${presupuestos.length}`;
  const box = document.getElementById('pres-results-list');
  if (!presupuestos.length){
    box.innerHTML = `<p style="padding:20px;color:var(--muted)">Todavía no hay presupuestos. Usá "+ Nuevo presupuesto" para armar el primero.</p>`;
    return;
  }
  if (!list.length){
    box.innerHTML = `<p style="padding:20px;color:var(--muted)">No hay presupuestos que coincidan con el filtro.</p>`;
    return;
  }
  box.innerHTML = `
    <table class="productos-table">
      <thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Estado</th><th></th></tr></thead>
      <tbody>${list.map(p => `
        <tr>
          <td>#${p.id}</td>
          <td>${new Date(p.creado_en).toLocaleDateString('es-AR')}</td>
          <td><span class="producto-nombre">${escapeHtml(p.cliente_nombre || 'Sin nombre')}</span>${p.pedido_id ? `<span class="badge-cuenta">Pedido #${p.pedido_id}</span>` : ''}${p.cliente_telefono ? `<div style="color:var(--muted);font-size:11.5px">${escapeHtml(p.cliente_telefono)}</div>` : ''}</td>
          <td>${(p.items || []).length}</td>
          <td><strong>${money(p.total)}</strong>${p.descuento_pct ? `<div style="color:var(--muted);font-size:11px">-${p.descuento_pct}% incluido</div>` : ''}</td>
          <td>
            <select class="pedido-estado ${p.estado}" onchange="updateEstadoPresupuesto(${p.id}, this.value)">
              ${ESTADOS_PRES.map(e => `<option value="${e.id}" ${e.id === p.estado ? 'selected' : ''}>${e.label}</option>`).join('')}
            </select>
          </td>
          <td>
            <div class="pres-actions">
              <button onclick="openPresEditor(${p.id})">Ver / editar</button>
              <button onclick="repetirPresupuesto(${p.id})">Repetir</button>
              <button onclick="pasarPresupuestoAPedido(${p.id})">${p.pedido_id ? 'Ver pedido' : 'Pasar a pedido'}</button>
              <button onclick="generarPresupuestoPDF(presupuestos.find(x => x.id === ${p.id}))">PDF</button>
              <button class="wa" onclick="enviarPresupuestoWhatsApp(${p.id})">WhatsApp</button>
              <button class="danger" onclick="borrarPresupuesto(${p.id})">Borrar</button>
            </div>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

async function updateEstadoPresupuesto(id, estado){
  const idx = presupuestos.findIndex(p => p.id === id);
  if (idx >= 0) presupuestos[idx] = { ...presupuestos[idx], estado };
  renderPresupuestosLista();
  const { error } = await sb.from('presupuestos').update({ estado, actualizado_en: new Date().toISOString() }).eq('id', id);
  if (error) console.error('No se pudo actualizar el estado del presupuesto:', error.message);
}

async function borrarPresupuesto(id){
  if (!confirm(`¿Borrar el presupuesto #${id}? No se puede deshacer.`)) return;
  const { error } = await sb.from('presupuestos').delete().eq('id', id);
  if (error){ alert('No se pudo borrar: ' + error.message); return; }
  presupuestos = presupuestos.filter(p => p.id !== id);
  renderPresupuestosLista();
}

// ----- Editor -----

function nuevoPresBase(){
  return { id: null, cliente_nombre: '', cliente_telefono: '', nota: '', items: [], descuento_pct: 0, estado: 'borrador', valido_hasta: null, creado_en: null };
}

function openPresEditor(id, base, banner){
  const p = id ? presupuestos.find(x => x.id === id) : null;
  presEdit = base ? base : p ? JSON.parse(JSON.stringify(p)) : nuevoPresBase();
  presEdit.items = Array.isArray(presEdit.items) ? presEdit.items : [];

  document.getElementById('pres-title').textContent = presEdit.id ? `Presupuesto #${presEdit.id}` : 'Nuevo presupuesto';
  document.getElementById('pres-cliente').value = presEdit.cliente_nombre || '';
  document.getElementById('pres-tel').value = presEdit.cliente_telefono || '';
  document.getElementById('pres-nota').value = presEdit.nota || '';
  document.getElementById('pres-descuento').value = presEdit.descuento_pct || '';
  document.getElementById('pres-valido').value = presEdit.valido_hasta || '';
  document.getElementById('pres-estado').innerHTML = ESTADOS_PRES.map(e => `<option value="${e.id}">${e.label}</option>`).join('');
  document.getElementById('pres-estado').value = presEdit.estado || 'borrador';
  document.getElementById('pres-buscar').value = '';
  document.getElementById('pres-results').style.display = 'none';
  document.getElementById('pres-error').textContent = '';
  const b = document.getElementById('pres-banner');
  b.style.display = banner ? 'block' : 'none';
  b.textContent = banner || '';

  renderPresLineas();
  document.getElementById('pres-overlay').classList.add('open');
  document.getElementById('pres-modal').classList.add('open');
}

function closePresEditor(){
  document.getElementById('pres-overlay').classList.remove('open');
  document.getElementById('pres-modal').classList.remove('open');
}

// Repetir = abrir un presupuesto NUEVO con los mismos datos y productos (se guarda como otro, el original no se toca).
function repetirPresupuesto(id){
  const p = presupuestos.find(x => x.id === id);
  if (!p) return;
  const copia = JSON.parse(JSON.stringify(p));
  copia.id = null; copia.estado = 'borrador'; copia.valido_hasta = null; copia.creado_en = null;
  openPresEditor(null, copia, `Copia del presupuesto #${id}: se mantienen los precios de ese día. Usá "Actualizar a precios de hoy" si querés tomar los precios actuales.`);
}

function renderPresResultados(){
  const q = document.getElementById('pres-buscar').value.trim().toLowerCase();
  const box = document.getElementById('pres-results');
  if (!q){ box.style.display = 'none'; return; }
  const found = productos.filter(p => p.activo && p.nombre.toLowerCase().includes(q)).slice(0, 12);
  box.innerHTML = found.length
    ? found.map(p => `
        <button onclick="agregarLineaPres(${p.id})">
          <span>${escapeHtml(p.nombre)} <span class="sub">· ${escapeHtml(p.unidad || '')}${p.sin_stock ? ' · sin stock' : ''}</span></span>
          <strong>${money(precioActualProducto(p))}</strong>
        </button>`).join('')
    : `<div style="padding:10px;color:var(--muted);font-size:12.5px">No hay productos con ese nombre.</div>`;
  box.style.display = 'block';
}

function agregarLineaPres(productoId){
  const p = productos.find(x => x.id === productoId);
  if (!p) return;
  const existente = presEdit.items.find(it => it.producto_id === p.id);
  if (existente) existente.cantidad += 1;
  else presEdit.items.push({ producto_id: p.id, nombre: p.nombre, unidad: p.unidad || '', precio: precioActualProducto(p), cantidad: 1 });
  document.getElementById('pres-buscar').value = '';
  document.getElementById('pres-results').style.display = 'none';
  renderPresLineas();
}

function renderPresLineas(){
  const wrap = document.getElementById('pres-lines-wrap');
  if (!presEdit.items.length){
    wrap.innerHTML = `<p style="color:var(--muted);font-size:12.5px;margin:12px 0">Todavía no agregaste productos. Buscá arriba y tocá uno para sumarlo.</p>`;
  } else {
    wrap.innerHTML = `
      <table class="pres-lines">
        <thead><tr><th>Producto</th><th>Unidad</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr></thead>
        <tbody>${presEdit.items.map((it, i) => `
          <tr>
            <td>${escapeHtml(it.nombre)}</td>
            <td>${escapeHtml(it.unidad)}</td>
            <td><input type="number" min="0" step="1" value="${it.precio}" oninput="presLineaCambio(${i}, 'precio', this.value)"></td>
            <td><input class="qty" type="number" min="1" step="1" value="${it.cantidad}" oninput="presLineaCambio(${i}, 'cantidad', this.value)"></td>
            <td id="pres-sub-${i}"><strong>${money(it.precio * it.cantidad)}</strong></td>
            <td><button class="btn" style="padding:3px 8px" onclick="quitarLineaPres(${i})" aria-label="Quitar">✕</button></td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  }
  actualizarPresTotales();
}

function presLineaCambio(i, campo, valor){
  const n = parseInt(valor, 10);
  presEdit.items[i][campo] = Number.isFinite(n) && n >= 0 ? n : 0;
  const cell = document.getElementById('pres-sub-' + i);
  if (cell) cell.innerHTML = `<strong>${money(presEdit.items[i].precio * presEdit.items[i].cantidad)}</strong>`;
  actualizarPresTotales();
}

function quitarLineaPres(i){
  presEdit.items.splice(i, 1);
  renderPresLineas();
}

function actualizarPresTotales(){
  const t = calcTotalesPres(presEdit);
  document.getElementById('pres-totales').innerHTML = `
    <div><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
    ${presEdit.descuento_pct ? `<div><span>Descuento (${presEdit.descuento_pct}%)</span><span>-${money(t.descuento)}</span></div>` : ''}
    <div class="total"><span>Total</span><span>${money(t.total)}</span></div>`;
}

function actualizarPreciosPresEditor(){
  let cambiados = 0, faltantes = 0;
  presEdit.items.forEach(it => {
    const p = productos.find(x => x.id === it.producto_id)
      || productos.find(x => x.nombre === it.nombre && (x.unidad || '') === it.unidad);
    if (!p){ faltantes++; return; }
    const nuevo = precioActualProducto(p);
    if (nuevo !== it.precio){ it.precio = nuevo; cambiados++; }
    it.producto_id = p.id;
  });
  renderPresLineas();
  const b = document.getElementById('pres-banner');
  b.style.display = 'block';
  b.textContent = cambiados || faltantes
    ? `Precios actualizados: ${cambiados} cambiaron${faltantes ? `, ${faltantes} producto(s) ya no existen y quedaron con su precio anterior` : ''}.`
    : 'Los precios ya estaban al día.';
}

async function guardarPresupuesto(opts){
  const p = presEdit;
  const errorEl = document.getElementById('pres-error');
  if (!p.items.length){ errorEl.textContent = 'Agregá al menos un producto.'; return false; }
  if (p.items.some(it => !(it.cantidad > 0))){ errorEl.textContent = 'Todas las cantidades tienen que ser 1 o más.'; return false; }
  errorEl.textContent = '';

  const payload = {
    cliente_nombre: (p.cliente_nombre || '').trim() || null,
    cliente_telefono: (p.cliente_telefono || '').trim() || null,
    nota: (p.nota || '').trim() || null,
    items: p.items,
    descuento_pct: p.descuento_pct || 0,
    total: calcTotalesPres(p).total,
    estado: p.estado || 'borrador',
    valido_hasta: p.valido_hasta || null,
    actualizado_en: new Date().toISOString(),
  };
  if (p.pedido_id) payload.pedido_id = p.pedido_id; // solo si existe, así guardar anda aunque falte esa columna

  const btn = document.getElementById('pres-save');
  btn.disabled = true; btn.textContent = 'Guardando...';
  const q = p.id ? sb.from('presupuestos').update(payload).eq('id', p.id).select().single()
                 : sb.from('presupuestos').insert(payload).select().single();
  const { data, error } = await q;
  btn.disabled = false; btn.textContent = 'Guardar';
  if (error){ errorEl.textContent = 'No se pudo guardar: ' + error.message; return false; }

  const idx = presupuestos.findIndex(x => x.id === data.id);
  if (idx >= 0) presupuestos[idx] = data; else presupuestos.unshift(data);
  presEdit = JSON.parse(JSON.stringify(data));
  renderPresupuestosLista();
  if (!(opts && opts.keepOpen)) closePresEditor();
  return true;
}

// ----- PDF y WhatsApp -----

async function generarPresupuestoPDF(p){
  if (!p) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const ROJO = [92, 0, 1], NEGRO = [0, 0, 0];
  const items = Array.isArray(p.items) ? p.items : [];
  const t = calcTotalesPres(p);

  let tituloX = 14;
  if (logoUrl){
    try {
      doc.addImage(await cargarImagenComoDataURL(logoUrl), 'JPEG', 14, 10, 22, 22);
      tituloX = 40;
    } catch (e){ console.error('No se pudo incrustar el logo en el PDF:', e); }
  }
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(24);
  doc.setTextColor(31, 78, 68);
  doc.text('Los Turquitos', tituloX, 24);
  doc.setTextColor(...NEGRO);
  doc.setFontSize(11);
  doc.text(p.id ? `Presupuesto #${p.id}` : 'Presupuesto', 14, 40);
  doc.text(`Fecha: ${new Date(p.creado_en || Date.now()).toLocaleDateString('es-AR')}`, 14, 46);
  let y = 52;
  if (p.valido_hasta){
    const [yy, mm, dd] = String(p.valido_hasta).split('-');
    doc.text(`Válido hasta: ${dd}/${mm}/${yy}`, 14, y); y += 6;
  }
  if (p.cliente_nombre){ doc.text(`Cliente: ${p.cliente_nombre}`, 14, y); y += 6; }
  y += 4;

  doc.setTextColor(...ROJO);
  doc.setFontSize(13);
  doc.text('Detalle', 14, y);
  y += 8;
  doc.setFontSize(9.5);
  doc.text('PRODUCTO', 14, y); doc.text('CANT.', 120, y, { align: 'right' });
  doc.text('PRECIO', 155, y, { align: 'right' }); doc.text('SUBTOTAL', 196, y, { align: 'right' });
  doc.setDrawColor(...ROJO); doc.setLineWidth(0.3); doc.line(14, y + 2, 196, y + 2);
  y += 8;

  doc.setFontSize(11);
  items.forEach(it => {
    const lineas = doc.splitTextToSize(`${it.nombre} (${it.unidad})`, 92);
    if (y + lineas.length * 5 > 270){ doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold'); doc.setTextColor(...NEGRO);
    doc.text(lineas, 14, y);
    doc.text(String(it.cantidad), 120, y, { align: 'right' });
    doc.text(money(it.precio), 155, y, { align: 'right' });
    doc.setTextColor(...ROJO);
    doc.text(money(it.precio * it.cantidad), 196, y, { align: 'right' });
    y += Math.max(1, lineas.length) * 5 + 2;
  });

  y += 2;
  doc.setDrawColor(...ROJO); doc.setLineWidth(0.5); doc.line(14, y, 196, y);
  y += 9;
  doc.setTextColor(...NEGRO); doc.setFontSize(11);
  if (p.descuento_pct){
    doc.text(`Subtotal: ${money(t.subtotal)}`, 196, y, { align: 'right' }); y += 6;
    doc.text(`Descuento (${p.descuento_pct}%): -${money(t.descuento)}`, 196, y, { align: 'right' }); y += 8;
  }
  doc.setFontSize(15); doc.setTextColor(...ROJO);
  doc.text(`Total: ${money(t.total)}`, 196, y, { align: 'right' });
  y += 12;
  doc.setTextColor(...NEGRO); doc.setFontSize(10);
  if (p.nota){
    const nl = doc.splitTextToSize(`Nota: ${p.nota}`, 182);
    doc.text(nl, 14, y); y += nl.length * 5 + 4;
  }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(112, 121, 118);
  doc.text('Precios sujetos a confirmación de stock. Los Turquitos — Pedidos por WhatsApp +54 9 3856 14-9181.', 14, 285);

  doc.save(`presupuesto-${p.id || 'nuevo'}-${(p.cliente_nombre || 'cliente').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase()}.pdf`);
}

function presEditorPDF(){ generarPresupuestoPDF({ ...presEdit, total: calcTotalesPres(presEdit).total }); }

// Número argentino para wa.me: solo dígitos, con prefijo 549 si no lo trae.
function waPhone(raw){
  let d = String(raw || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('54')) return d;
  d = d.replace(/^0+/, '');
  return '549' + d;
}

function textoPresupuestoWhatsApp(p){
  const t = calcTotalesPres(p);
  let msg = `Hola${p.cliente_nombre ? ' ' + p.cliente_nombre : ''}, te paso el presupuesto de Los Turquitos${p.id ? ' #' + p.id : ''}:\n\n`;
  (p.items || []).forEach(it => { msg += `• ${it.nombre} — ${it.cantidad} × ${it.unidad} = ${money(it.precio * it.cantidad)}\n`; });
  if (p.descuento_pct) msg += `\nSubtotal: ${money(t.subtotal)}\nDescuento (${p.descuento_pct}%): -${money(t.descuento)}`;
  msg += `\n*Total: ${money(t.total)}*`;
  if (p.valido_hasta){ const [y, m, d] = String(p.valido_hasta).split('-'); msg += `\nVálido hasta el ${d}/${m}/${y}.`; }
  if (p.nota) msg += `\n\n${p.nota}`;
  msg += '\n\nCualquier duda avisame. ¡Gracias!';
  return msg;
}

// La ventana se abre YA (dentro del clic) y recién después se le pone la URL: Safari bloquea los popups abiertos tras un await.
function abrirWhatsApp(win, p){
  const tel = waPhone(p.cliente_telefono);
  const url = `https://wa.me/${tel}?text=${encodeURIComponent(textoPresupuestoWhatsApp(p))}`;
  if (win) win.location.href = url; else window.open(url, '_blank');
}

async function enviarPresupuestoWhatsApp(id){
  const p = presupuestos.find(x => x.id === id);
  if (!p) return;
  const win = window.open('', '_blank');
  abrirWhatsApp(win, p);
  if (p.estado === 'borrador') updateEstadoPresupuesto(id, 'enviado');
}

async function presEditorWhatsApp(){
  const win = window.open('', '_blank');
  const ok = await guardarPresupuesto({ keepOpen: true });
  if (!ok){ if (win) win.close(); return; }
  abrirWhatsApp(win, presEdit);
  if (presEdit.estado === 'borrador'){
    await updateEstadoPresupuesto(presEdit.id, 'enviado');
    presEdit.estado = 'enviado';
    document.getElementById('pres-estado').value = 'enviado';
  }
  document.getElementById('pres-title').textContent = `Presupuesto #${presEdit.id}`;
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape'){ closeProductoModal(); closePresEditor(); cerrarImport(); } });

// ---------- Init ----------

checkSession();
</script>
